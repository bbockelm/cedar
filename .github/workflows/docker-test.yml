name: Docker Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  docker-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    - name: Build test image
      run: docker build -t golang-cedar-test .

    - name: Run unit tests
      run: docker run --rm golang-cedar-test go test -v -short ./...

    - name: Run all tests
      run: docker run --rm golang-cedar-test go test -v ./...

  docker-compose-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Docker Compose
      uses: docker/setup-compose-action@4eb059ff7f16592f9c84d5ca339c53cb7c5064e2 # v2.3.0

    - name: Run tests via docker compose
      run: docker compose up --abort-on-container-exit test

    - name: Run coverage
      run: docker compose up --abort-on-container-exit test-coverage
